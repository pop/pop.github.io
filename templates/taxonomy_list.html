{% extends "base.html" %}

{% block main %}
  {% include "header.html" %}
  <main>
    <h1>.../{{ taxonomy.name }}</h1>
    <div class="tags">
      {%- set tags = get_taxonomy(kind="tags", lang=lang) %}
      {%- for post in tags.items %}
        <a href="{{ post.permalink }}">#{{ post.name }}</a>
      {%- endfor %}
    </div>
  </main>
  {% include "footer.html" %}
{% endblock %}
