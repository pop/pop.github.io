### Webamp music player
# Placeholder track — replace `url` with a real MP3 (place file in `public/music/`).
# Remove this entire `[webamp]` section (or leave `tracks` empty) to disable the player.
# `skin_url` is optional; omit for the default Winamp skin. Files in `public/` are served from `/`.
[webamp]
skin_url = "/qsteamp.wsz"
top = 20  # pixels from top of viewport for the main player window

