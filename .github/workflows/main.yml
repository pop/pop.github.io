name: Publish Blog

on:
  push:
    branches:
      - source
    paths:
      - 'content/**'
      - 'templates/**'
      - 'config.toml'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
        submodules: recursive

    - name: build_and_deploy
      uses: shalzz/zola-deploy-action@v0.19.2
      env:
        PAGES_BRANCH: gh-pages
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
